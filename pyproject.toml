[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agri-decision-engine"
version = "0.1.0"
description = "Motor auditavel de aptidao, rentabilidade e risco agricola do Brasil"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary - licensing decision pending"}
authors = [{name = "Projeto Motor de Decisao Agricola"}]
dependencies = [
  "pydantic>=2.8,<3",
  "PyYAML>=6.0.2,<7",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
data = [
  "cdsapi>=0.7,<1",
  "xarray>=2024.6,<2027",
  "h5netcdf>=1.3,<2",
  "h5py>=3,<4",
  "scipy>=1.13,<2",
  "filelock>=3.16,<4",
  "numcodecs>=0.15,<1",
  "duckdb>=1.1,<2",
  "httpx>=0.27,<1",
  "numpy>=2.0,<3",
  "polars>=1.40,<2",
  "pyarrow>=17,<24",
  "shapely>=2.0,<3",
]
api = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
]
ui = ["streamlit>=1.38,<2"]
ml = [
  "catboost>=1.2,<2",
  "lightgbm>=4.5,<5",
  "mlflow>=2.16,<4",
  "scikit-learn>=1.5,<2",
  "xgboost>=2.1,<4",
]
postgres = [
  "alembic>=1.13,<2",
  "geoalchemy2>=0.15,<1",
  "psycopg[binary]>=3.2,<4",
  "sqlalchemy>=2.0,<3",
]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8.3,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.6,<1",
  "types-shapely>=2.0.0,<3",
  "types-PyYAML>=6.0.12,<7",
]

[project.scripts]
agri = "agri_decision.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["agri_decision"]
